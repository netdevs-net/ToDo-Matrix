name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor stated in package.json engines, and current LTS. A
        # self-hoster running either should get the same result.
        node: ['18', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
